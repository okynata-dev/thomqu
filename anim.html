<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUANG — live glitch</title>
<style>
  html,body{margin:0;height:100%;background:#fff;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{max-width:100vw;max-height:96vh;display:block;cursor:pointer;}
  #cap{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#ccc;font:11px ui-monospace,Menlo,monospace;user-select:none;}
  #cap a{color:#ccc;text-decoration:none;padding:0 4px;}
  #cap a:hover{color:#666;}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="cap">rendering frames…</div>
<script src="master-data.js"></script>
<script src="engine.js"></script>
<script src="series.js"></script>
<script src="glitch-player.js"></script>
<script>
"use strict";
const p=new URLSearchParams(location.search);
const COUNT=Math.max(1,Math.min(2000,parseInt(p.get("count")||"500",10)||500));
const N=Math.max(1,Math.min(COUNT,parseInt(p.get("n")||"1",10)||1));
const LONG=Math.max(600,Math.min(4096,parseInt(p.get('res')||'1200',10)||1200));
const TEMP=Math.max(0,Math.min(1,parseFloat(p.get('t')||'0.5')||0.5));
const FPS=Math.max(4,Math.min(300,parseInt(p.get('fps')||'300',10)||300));
const MULT=Math.max(1,Math.round(FPS/60)),TICK=Math.round(1000/Math.min(FPS,60));
const SER=(p.get('s')||'huang').replace(/[^a-z]/g,'');
const H=LONG,Wt=Math.round(H*0.75);
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

let playing=true;
(async()=>{
  let masters=[window.MASTER_SRC];
  try{const m=await(await fetch('assets/'+SER+'/manifest.json')).json();
    if(m.masters&&m.masters.length)masters=m.masters.map(f=>'assets/'+SER+'/'+f);}catch(e){}
  const img=new Image();
  img.onload=()=>{ENGINE.init(Wt,H);ENGINE.setCount(COUNT);ENGINE.setSeries(window.SERIES_CFG&&SERIES_CFG[SER]||null);
    ENGINE.fitMaster(img);ENGINE.setTemp(TEMP);ENGINE.setPress(p.get('press')!=='0');setTimeout(start,30);};
  img.src=masters[hashStr('master-'+SER+'-'+(N-1))%masters.length];
})();

function start(){
  const frames=ENGINE.animFrames(N-1,7);
  const cvs=frames.map(f=>{const c=document.createElement('canvas');c.width=Wt;c.height=H;c.getContext('2d').putImageData(f,0,0);return c;});
  const cv=document.createElement('canvas');cv.width=Wt;cv.height=H;
  document.getElementById('wrap').appendChild(cv);
  cv.onclick=()=>playing=!playing;

  const player=GLITCH.build(SER+'-'+N,cvs,cv.getContext('2d'),(window.SERIES_CFG&&SERIES_CFG[SER]||{}).glitch);

  document.getElementById('cap').innerHTML=
    '#'+N+'/'+COUNT+' · live glitch · '+player.style+' · '+player.staticPct+'% static · '+FPS+'fps · t '+TEMP.toFixed(2)
    +' · <a href="token.html?n='+N+'&t='+TEMP.toFixed(3)+'&s='+SER+'">still</a>'
    +' · <a href="anim.html?n='+((N%COUNT)+1)+'&t='+TEMP.toFixed(3)+'&fps='+FPS+'&s='+SER+'">next ›</a>'
    +' · <a href="anim10.html?t='+TEMP.toFixed(3)+'&s='+SER+'">×10</a>'
    +' · click = pause';

  setInterval(()=>{if(playing)player.step(MULT);},TICK);
}
</script>
</body>
</html>
