<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Press Run — THOMQU</title>
<meta name="description" content="Browse the full press run — generative silkscreen portraits wired to a ticker.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#15120f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THOMQU PRESS">
<meta property="og:title" content="The Press Run — THOMQU">
<meta property="og:description" content="Generative silkscreen portraits wired to a ticker.">
<meta property="og:image" content="https://thomqu.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@thomqu">
<meta name="twitter:image" content="https://thomqu.com/og.png">
<style>
  html,body{margin:0;background:#fff;}
  #nav{position:sticky;top:0;background:rgba(255,255,255,0.94);z-index:5;padding:10px 16px;
       font:12px ui-monospace,Menlo,monospace;color:#999;border-bottom:1px solid #eee;}
  #nav a{color:#999;text-decoration:none;padding:0 6px;}
  #nav a:hover{color:#000;}
  #nav a.on{color:#000;font-weight:700;}
  #nav .r{float:right;}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px;}
  /* cell holds a STABLE box (aspect-ratio) so page height/scroll stay fixed even when the
     canvas inside is destroyed off-screen — this is what keeps IntersectionObserver honest. */
  #grid .cell{position:relative;aspect-ratio:3/4;background:#f4f0e8;}
  #grid canvas{display:block;width:100%;height:100%;cursor:pointer;transition:opacity .12s;}
  #grid canvas:hover{opacity:.85;}
  #grid span{position:absolute;left:8px;bottom:6px;color:rgba(0,0,0,0.35);font:11px ui-monospace,Menlo,monospace;pointer-events:none;}
  /* mobile: fewer columns => fewer simultaneous canvases; legible tiles on a phone. */
  @media(max-width:700px){#grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}}
</style>
</head>
<body>
<div id="nav"></div>
<div id="grid"></div>
<script src="master-data.js"></script>
<script src="engine.js?v=9"></script>
<script src="series.js?v=9"></script>
<script>
"use strict";
// Device-adaptive budget. Mobile Safari has a hard ceiling on total canvas backing-store memory
// (~256–384MB) and blanks the page when exceeded. We render at lower res, prefetch a shorter
// distance, and hard-cap the number of live canvases so we never approach that ceiling.
const MOBILE=matchMedia('(max-width:700px)').matches||/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const RW=MOBILE?480:720, RH=MOBILE?640:960;            // tile render res
const MARGIN=MOBILE?'400px 0px':'1400px 0px';          // IntersectionObserver prefetch distance
const MAXLIVE=MOBILE?18:160;                           // hard cap on simultaneously-materialized canvases
const Q=new URLSearchParams(location.search);
const TEMP=Math.max(0,Math.min(1,parseFloat(Q.get('t')||'0.5')||0.5));
const SER=(Q.get('s')||'huang').replace(/[^a-z]/g,'');          // серия: huang | saylor | vitalik
const COUNT=Math.max(1,Math.min(2000,parseInt(Q.get('count')||'500',10)||500));
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

let MASTERS=[window.MASTER_SRC];       // fallback — один встроенный мастер
const ICACHE={};
const midx=i=>hashStr('master-'+SER+'-'+i)%(window.__MMOD||MASTERS.length);      // фото токена выбирается seed'ом
const getImg=mi=>ICACHE[mi]||(ICACHE[mi]=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=MASTERS[mi];}));

let TOKENS=[];                         // список id токенов (вся серия или кураторский набор из манифеста)
const cells={};                        // i -> постоянный <div> (дёшево, живёт всегда)
const cvs={};                          // i -> <canvas> ТОЛЬКО пока тайл материализован
const done={};                         // i -> отрисован
const live=[];                         // порядок материализации (LRU для капа)
const visible=new Set();               // что сейчас в зоне видимости (нельзя выселять)
const queue=[];let busy=false;

function enqueue(i){if(cvs[i]&&!done[i]&&queue.indexOf(i)<0){queue.push(i);pump();}}

// создать canvas и поставить в очередь рендера — только когда тайл в зоне
function materialize(i){
  if(cvs[i])return;
  const cv=document.createElement('canvas');cv.dataset.i=i;
  cv.addEventListener('click',()=>window.open('token.html?n='+(i+1)+'&t='+TEMP.toFixed(3)+'&s='+SER,'_blank'));
  cells[i].appendChild(cv);
  cvs[i]=cv;live.push(i);
  enforceCap();
  enqueue(i);
}

// полностью уничтожить canvas — освобождаем backing store И удаляем DOM-узел
function dematerialize(i){
  const cv=cvs[i];if(!cv)return;
  cv.width=cv.height=0;                 // сразу сбрасываем буфер
  cv.remove();                          // и сам элемент
  delete cvs[i];delete done[i];
  const k=live.indexOf(i);if(k>=0)live.splice(k,1);
  const qk=queue.indexOf(i);if(qk>=0)queue.splice(qk,1);
}

// backstop: если живых canvas больше капа — выселяем самые старые, КРОМЕ видимых сейчас
function enforceCap(){
  for(let k=0;live.length>MAXLIVE&&k<live.length;){
    const i=live[k];
    if(visible.has(i)){k++;continue;}
    dematerialize(i);                   // splice сдвигает live, индекс k не трогаем
  }
}

function pump(){
  if(busy||!queue.length)return;busy=true;
  const i=queue.shift();
  if(!cvs[i]||done[i]){busy=false;pump();return;}
  getImg(midx(i)).then(im=>setTimeout(()=>{
    const cv=cvs[i];                    // мог быть уничтожен пока грузилось фото
    if(cv&&im){ENGINE.fitMaster(im);cv.width=RW;cv.height=RH;
      cv.getContext('2d').putImageData(new ImageData(ENGINE.compose(i),RW,RH),0,0);done[i]=true;}
    busy=false;pump();},0));
}

function nav(){
  const names={huang:'HUANG/NVDA',saylor:'SAYLOR/MSTR',vitalik:'BUTERIN/ETH',powell:'POWELL/FED',gates:'GATES/MSFT',zuck:'ZUCK/META',cz:'CZ/BNB',trump:'TRUMP/$TRUMP',musk:'MUSK/DOGE',sbf:'SBF/FTT',cathie:'WOOD/ARKK',buffett:'BUFFETT/BRK',armstrong:'ARMSTRONG/COIN',dorsey:'DORSEY/BTC',dimon:'DIMON/JPM',dokwon:'KWON/LUNA',sun:'SUN/TRX',ternus:'TERNUS/AAPL'};
  // публично показываем только текущую серию — остальные коллекции скрыты до их запуска
  document.getElementById('nav').innerHTML=
    '<a href="index.html" style="font-weight:700">THOMQU</a> &nbsp;·&nbsp; '
    +'<span class="on">'+(names[SER]||SER)+'</span>'
    +'<span class="r">'+TOKENS.length+' works</span>';
}
function build(){
  const grid=document.getElementById('grid');
  for(const i of TOKENS){
    const cell=document.createElement('div');cell.className='cell';cell.dataset.i=i;
    const lab=document.createElement('span');lab.textContent='#'+(i+1);
    cell.appendChild(lab);grid.appendChild(cell);cells[i]=cell;
  }
  const io=new IntersectionObserver(es=>{
    for(const e of es){const i=+e.target.dataset.i;
      if(e.isIntersecting){visible.add(i);materialize(i);}    // в зоне — создаём и рендерим
      else{visible.delete(i);dematerialize(i);}}              // ушёл из зоны — уничтожаем
  },{rootMargin:MARGIN});
  TOKENS.forEach(i=>io.observe(cells[i]));                    // наблюдаем за стабильными div, не за canvas
}
(async()=>{
  let man=null;
  try{man=await(await fetch('assets/'+SER+'/manifest.json')).json();}catch(e){}
  window.__MMOD=(man&&man.masterMod)||0;
  if(man&&man.masters&&man.masters.length){MASTERS=man.masters.map(f=>'assets/'+SER+'/'+f);document.title=(man.name||'The Press Run')+' — THOMQU';}
  TOKENS=(man&&man.curated&&man.curated.length&&!Q.get('all'))
    ? man.curated.map(n=>n-1)                            // кураторский набор (1-based в манифесте)
    : Array.from({length:COUNT},(_,i)=>i);
  ENGINE.init(RW,RH);ENGINE.setCount(COUNT);
  ENGINE.setSeries(window.SERIES_CFG&&SERIES_CFG[SER]||null);
  ENGINE.setTemp(TEMP);ENGINE.setPress(Q.get('press')!=='0');
  nav();build();
})();
</script>
</body>
</html>
