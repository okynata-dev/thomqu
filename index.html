<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>99 generative composites</title>
<style>
  html,body{margin:0;background:#fff;}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px;}
  #grid canvas{display:block;width:100%;aspect-ratio:3/4;height:auto;background:#f4f0e8;cursor:pointer;transition:opacity .12s;}
  #grid canvas:hover{opacity:.85;}
</style>
</head>
<body>
<div id="grid"></div>
<script src="master-data.js"></script>
<script src="engine.js"></script>
<script>
"use strict";
const RW=1080,RH=1440;                 // per-tile render resolution (lazy: only rendered when scrolled near)
const Q=new URLSearchParams(location.search);
const TEMP=Math.max(0,Math.min(1,parseFloat(Q.get('t')||'0.5')||0.5));
const SER=(Q.get('s')||'huang').replace(/[^a-z]/g,'');          // серия: huang | saylor | vitalik
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

let MASTERS=[window.MASTER_SRC];       // fallback — один встроенный мастер
const ICACHE={};
const midx=i=>hashStr('master-'+SER+'-'+i)%MASTERS.length;      // фото токена выбирается seed'ом
const getImg=mi=>ICACHE[mi]||(ICACHE[mi]=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=MASTERS[mi];}));

const cvs=[],done=new Array(99).fill(false),queue=[];let busy=false;
function enqueue(i){if(!done[i]&&queue.indexOf(i)<0){queue.push(i);pump();}}
function pump(){
  if(busy||!queue.length)return;busy=true;
  const i=queue.shift();
  if(done[i]){busy=false;pump();return;}
  getImg(midx(i)).then(im=>setTimeout(()=>{
    if(im){ENGINE.fitMaster(im);const cv=cvs[i];cv.width=RW;cv.height=RH;
      cv.getContext('2d').putImageData(new ImageData(ENGINE.compose(i),RW,RH),0,0);done[i]=true;}
    busy=false;pump();},0));
}
function build(){
  const grid=document.getElementById('grid');
  for(let i=0;i<99;i++){const cv=document.createElement('canvas');cv.dataset.i=i;cv.title='#'+(i+1)+' — click for 4K';
    cv.addEventListener('click',()=>window.open('token.html?n='+(i+1)+'&t='+TEMP.toFixed(3)+'&s='+SER,'_blank'));grid.appendChild(cv);cvs.push(cv);}
  const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting)enqueue(+e.target.dataset.i);},{rootMargin:'800px 0px'});
  cvs.forEach(cv=>io.observe(cv));
  for(let i=0;i<9;i++)enqueue(i);                 // guarantee first rows even if observer is idle
  window.__renderTile=enqueue;                    // manual hook
}
(async()=>{
  try{const m=await(await fetch('assets/'+SER+'/manifest.json')).json();
    if(m.masters&&m.masters.length){MASTERS=m.masters.map(f=>'assets/'+SER+'/'+f);document.title=m.name+' — 99 composites';}}catch(e){}
  ENGINE.init(RW,RH);ENGINE.setTemp(TEMP);ENGINE.setPress(Q.get('press')!=='0');
  build();
})();
</script>
</body>
</html>
