<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press Kit — THOMQU</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#15120f">
<style>
 :root{--ink:#15120f;--paper:#f4f0e8;--dim:#75705f;--red:#ba1826}
 html,body{margin:0;background:var(--ink);color:var(--paper);font:13px/1.6 ui-monospace,Menlo,monospace}
 header{padding:34px 28px 10px} h1{font:700 34px "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;margin:0}
 header p{color:var(--dim);max-width:64ch}
 h2{font:700 15px "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;margin:30px 28px 0;color:var(--paper)}
 h2 small{color:var(--dim);font-weight:400}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:12px 28px 10px}
 .b{display:block;background:#000;text-decoration:none;color:var(--dim);border:1px solid #2a2722}
 .b img{display:block;width:100%;height:auto} .b span{display:block;padding:8px 10px;letter-spacing:.06em}
 .b:hover{border-color:var(--red)} .b:hover span{color:var(--paper)}
 footer{padding:30px 28px 60px;color:var(--dim)}
</style></head><body>
<header><h1>PRESS KIT</h1>
<p>THOMQU — one banner per collection. Each is a photomontage of the figure with the press finishes
and a full-bleed knockout wordmark. Wide header (1500×500) + square (1080×1080) per series. Click to download.</p></header>
<div id="kit"></div>
<footer>avatar_mark — <a href="banners/avatar_mark.png" download style="color:var(--red)">download</a> · THOMQU.COM</footer>
<script>
const S=[
 ['saylor','SAYLOR / MSTR']];   // только текущая серия в паблике; остальные скрыты до запуска
const tile=(f)=>`<a class="b" href="banners/${f}.png" download><img loading="lazy" src="banners/${f}.png"><span>${f}</span></a>`;
document.getElementById('kit').innerHTML=S.map(([s,name])=>
 `<h2>${name}</h2><div class="grid">${tile('banner_'+s)}${tile('square_'+s)}</div>`).join('');
</script>
</body></html>
