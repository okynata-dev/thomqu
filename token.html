<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token — THOMQU</title>
<meta name="description" content="A single silkscreen press run, 4K, with live price temperature.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#15120f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THOMQU PRESS">
<meta property="og:image" content="https://thomqu.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@thomqu">
<meta name="twitter:image" content="https://thomqu.com/og.png">
<style>
  html,body{margin:0;height:100%;background:#fff;}
  #wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{max-width:96vw;max-height:96vh;height:auto;width:auto;background:#fff;}
  #status{color:#bbb;font:13px ui-monospace,Menlo,monospace;}
  #cap{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#ccc;font:11px ui-monospace,Menlo,monospace;user-select:none;}
  #cap a{color:#ccc;text-decoration:none;padding:0 4px;}
  #cap a:hover{color:#666;}
  #cap input[type=range]{width:160px;vertical-align:middle;accent-color:#999;}
  .hot{color:#ff5a3c;} .cold{color:#5ab4ff;} .neutral{color:#999;}
</style>
</head>
<body>
<div id="wrap"><div id="status">rendering…</div></div>
<div id="cap"></div>
<script src="master-data.js"></script>
<script src="engine.js?v=8"></script>
<script src="series.js?v=8"></script>
<script>
"use strict";
const p=new URLSearchParams(location.search);
const COUNT=Math.max(1,Math.min(2000,parseInt(p.get("count")||"500",10)||500));
const N=Math.max(1,Math.min(COUNT,parseInt(p.get("n")||"1",10)||1));
const LONG=Math.max(1200,Math.min(4096,parseInt(p.get('res')||'3200',10)||3200));   // long side; ?res=3840 = UHD
let TEMP=Math.max(0,Math.min(1,parseFloat(p.get('t')||'0.5')||0.5));                // NVDA temperature; 0.5 = clean print
const SER=(p.get('s')||'huang').replace(/[^a-z]/g,'');                              // серия: huang | saylor | vitalik
const H=LONG, Wt=Math.round(H*0.75);
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const go=n=>location.href='token.html?n='+((n+COUNT-1)%COUNT+1)+'&res='+LONG+'&t='+TEMP.toFixed(3)+'&s='+SER; // wrap 1..99

(async()=>{
  let masters=[window.MASTER_SRC];
  try{const m=await(await fetch('assets/'+SER+'/manifest.json')).json();window.__MMOD=m.masterMod||0;
    if(m.masters&&m.masters.length)masters=m.masters.map(f=>'assets/'+SER+'/'+f);}catch(e){}
  const img=new Image();
  img.onload=()=>{ENGINE.init(Wt,H);ENGINE.setCount(COUNT);ENGINE.setSeries(window.SERIES_CFG&&SERIES_CFG[SER]||null);
    ENGINE.fitMaster(img);ENGINE.setTemp(TEMP);ENGINE.setPress(p.get('press')!=='0');setTimeout(render,30);};
  img.src=masters[hashStr('master-'+SER+'-'+(N-1))%(window.__MMOD||masters.length)];                 // фото токена — по seed'у
})();

const regime=t=>t>0.62?['OVERHEATED','hot']:t<0.38?['BURNOUT','cold']:['CLEAN','neutral'];

function render(){
  document.title=SER.charAt(0).toUpperCase()+SER.slice(1)+' #'+N+' — THOMQU';
  const work=ENGINE.compose(N-1);
  const cv=document.createElement('canvas');cv.width=Wt;cv.height=H;
  cv.getContext('2d').putImageData(new ImageData(work,Wt,H),0,0);
  const wrap=document.getElementById('wrap');wrap.innerHTML='';wrap.appendChild(cv);
  const cap=document.getElementById('cap');
  const[rg,cls]=regime(TEMP);
  cap.innerHTML='<a href="#" id="pv">‹</a> #'+N+'/'+COUNT+' · '+Wt+'×'+H+' <a href="#" id="nx">›</a> · <a href="#" id="sv">save</a>'
    +' · t <input id="tr" type="range" min="0" max="1" step="0.01" value="'+TEMP+'"> <b id="tv" class="'+cls+'">'+TEMP.toFixed(2)+' '+rg+'</b>';
  document.getElementById('pv').onclick=e=>{e.preventDefault();go(N-2);};
  document.getElementById('nx').onclick=e=>{e.preventDefault();go(N);};
  document.getElementById('sv').onclick=e=>{e.preventDefault();cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='huang_'+String(N).padStart(3,'0')+'_t'+TEMP.toFixed(2)+'_'+Wt+'x'+H+'.png';a.click();},'image/png');};
  const tr=document.getElementById('tr'),tv=document.getElementById('tv');
  tr.oninput=()=>{const t=+tr.value,[r2,c2]=regime(t);tv.textContent=t.toFixed(2)+' '+r2;tv.className=c2;};       // live label while dragging
  tr.onchange=()=>{TEMP=+tr.value;history.replaceState(null,'','token.html?n='+N+'&res='+LONG+'&t='+TEMP.toFixed(3)+'&s='+SER);ENGINE.setTemp(TEMP);render();}; // heavy re-render on release
}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(N-2);else if(e.key==='ArrowRight')go(N);else if(e.key==='s'){const cv=document.querySelector('#wrap canvas');if(cv)cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='huang_'+String(N).padStart(3,'0')+'.png';a.click();});}});
</script>
</body>
</html>
