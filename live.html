<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THOMQU — live</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap canvas{max-width:100%;max-height:100%;height:auto;width:auto;display:block;}
  #status{color:#555;font:13px ui-monospace,Menlo,monospace;}
  #hud{position:fixed;left:0;right:0;bottom:max(14px,2.4vh);text-align:center;z-index:2;
    font:600 14px ui-monospace,Menlo,monospace;color:#9a9a9a;letter-spacing:.06em;
    text-shadow:0 1px 4px #000;pointer-events:none;}
  #hud b{font-size:20px;}
  .up{color:#28d46e;} .dn{color:#eb2e3a;} .neu{color:#9a9a9a;}
</style>
</head>
<body>
<div id="wrap"><div id="status">…</div></div>
<div id="hud"></div>
<script src="master-data.js"></script>
<script src="engine.js?v=10"></script>
<script src="series.js?v=10"></script>
<script>
"use strict";
// animation_url renderer. Two ways to address a work:
//   ?s=<slug>&id=<edition>   -> drop edition, mapped via manifest.curated  (saylor drop)
//   ?s=<slug>&i=<engineIdx>  -> direct engine index                       (the 200 self-drop)
// The press temperature is driven by the figure's LIVE price within its frozen band.
// t=0.5 (mid band) == the frozen saved image; toward the high it overheats, toward the low it burns out.
const BANDS={                       // slug -> Yahoo symbol + frozen band + display ticker
 saylor:{sym:'MSTR',low:104.17,high:457.20,tk:'MSTR'},
 huang:{sym:'NVDA',low:140.85,high:236.54,tk:'NVDA'},
 vitalik:{sym:'ETH-USD',low:1388.12,high:4955.90,tk:'ETH'},
 powell:{sym:'^TNX',low:6.55,high:8.97,tk:'FED'},
 gates:{sym:'MSFT',low:356.28,high:555.45,tk:'MSFT'},
 zuck:{sym:'META',low:520.26,high:796.25,tk:'META'},
 cz:{sym:'BNB-USD',low:380,high:760,tk:'BNB'},
 trump:{sym:'TRUMP-USD',low:3.5,high:75.0,tk:'TRUMP'},
 musk:{sym:'DOGE-USD',low:0.07,high:0.48,tk:'DOGE'},
 sbf:{sym:'FTT-USD',low:0.9,high:55.0,tk:'FTT'},
 cathie:{sym:'ARKK',low:38,high:88,tk:'ARKK'},
 buffett:{sym:'BRK-B',low:408,high:558,tk:'BRK'},
 armstrong:{sym:'COIN',low:140,high:360,tk:'COIN'},
 dorsey:{sym:'BTC-USD',low:58000,high:112000,tk:'BTC'},
 dimon:{sym:'JPM',low:200,high:320,tk:'JPM'},
 dokwon:{sym:'LUNA-USD',low:0.0001,high:119.18,tk:'LUNA'},
 sun:{sym:'TRX-USD',low:0.09,high:0.45,tk:'TRX'},
 ternus:{sym:'AAPL',low:198,high:288,tk:'AAPL'},
};
const p=new URLSearchParams(location.search);
const SER=(p.get('s')||'saylor').replace(/[^a-z]/g,'');
const RES=Math.max(700,Math.min(1600,parseInt(p.get('res')||'1000',10)||1000));
const B=BANDS[SER]||{sym:(SER||'').toUpperCase(),low:0,high:1,tk:SER.toUpperCase()};
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

let MASTERS=[window.MASTER_SRC], ENG_IDX=0, prevPrice=null, ready=false;
const regime=t=>t>0.62?['OVERHEATED','up']:t<0.38?['BURNOUT','dn']:['CLEAN','neu'];

(async()=>{
  let man=null;
  try{man=await(await fetch('assets/'+SER+'/manifest.json')).json();}catch(e){}
  window.__MMOD=(man&&man.masterMod)||0;
  if(man&&man.masters&&man.masters.length)MASTERS=man.masters.map(f=>'assets/'+SER+'/'+f);
  const iParam=p.get('i'), idParam=p.get('id');
  if(iParam!=null) ENG_IDX=Math.max(0,parseInt(iParam,10)||0);                  // direct engine index
  else{const id=Math.max(1,parseInt(idParam||'1',10)||1);                       // edition -> engine index
    ENG_IDX=(man&&man.curated&&man.curated[id-1] ? man.curated[id-1] : id)-1;}
  const H=RES, W=Math.round(H*0.75);
  ENGINE.init(W,H); ENGINE.setSeries((window.SERIES_CFG&&SERIES_CFG[SER])||null); ENGINE.setPress(true);
  const src=MASTERS[hashStr('master-'+SER+'-'+ENG_IDX)%(window.__MMOD||MASTERS.length)];
  const img=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;});
  if(img)ENGINE.fitMaster(img);
  ready=true; await tick(); setInterval(tick, 5*60*1000);
})();

const fmtP=v=>v>=1000?Math.round(v).toLocaleString('en-US'):(v<1?v.toFixed(4):v.toFixed(2));
const fmtV=v=>v==null?null:(v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':''+v);

// Build today's REAL press copy: a live ticker line + data-driven headlines (our words, real numbers).
function buildLive(q,t){
  if(q.price==null)return null;
  const tk=B.tk, P=fmtP(q.price), chg=q.prevClose?(q.price/q.prevClose-1)*100:0,
        up=chg>=0, sgn=up?'+':'', arr=up?'▲':'▼';
  const ticks=[]; let main=tk+' '+P+' '+arr+' '+sgn+chg.toFixed(2)+'%';
  if(q.w52Low!=null&&q.w52High!=null)main+='   52W '+fmtP(q.w52Low)+'–'+fmtP(q.w52High);
  const vol=fmtV(q.volume); if(vol)main+='   VOL '+vol;
  if(q.date)main+='   '+q.date;
  ticks.push(main);
  if(q.dayHigh!=null&&q.dayLow!=null)ticks.push(tk+'  H '+fmtP(q.dayHigh)+'  L '+fmtP(q.dayLow)+'  LAST '+P);
  const heads=[], newHigh=q.w52High!=null&&q.price>=q.w52High*0.995, newLow=q.w52Low!=null&&q.price<=q.w52Low*1.02;
  if(newHigh){heads.push('RECORD CLOSE, AGAIN');heads.push(tk+' PRINTS A NEW HIGH');}
  else if(chg>=5){heads.push('THE MELT-UP CONTINUES');heads.push(tk+' '+sgn+chg.toFixed(1)+'% · STILL BID');}
  else if(chg>=1){heads.push('GREEN ON THE SCREEN');}
  else if(chg<=-5){heads.push('THE UNWIND ACCELERATES');heads.push(tk+' '+chg.toFixed(1)+'% · MARGIN MATH');}
  else if(chg<=-1){heads.push('RED ACROSS THE BOARD');}
  else{heads.push('THE MARKET HOLDS ITS BREATH');}
  if(newLow)heads.push('THE PREMIUM IS GONE');
  if(t>0.62)heads.push('EUPHORIA, PRICED IN'); else if(t<0.20)heads.push('AFTER THE GOLD RUSH');
  return {ticks, heads:heads.slice(0,3), stamps:[sgn+chg.toFixed(1)+'%','$'+P,arr]};
}

async function tick(){
  if(!ready)return;
  let q={price:null};
  try{q=await(await fetch('/price?ticker='+encodeURIComponent(B.sym)+'&_='+Date.now())).json();}catch(e){}
  let t=0.5;
  if(q.price!=null && B.high>B.low){t=(q.price-B.low)/(B.high-B.low);t=t<0?0:t>1?1:t;}
  ENGINE.setLive(buildLive(q,t)); ENGINE.setTemp(t);              // inject today's real facts + price temperature
  const W=ENGINE.W,H=ENGINE.H,work=ENGINE.compose(ENG_IDX);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  cv.getContext('2d').putImageData(new ImageData(work,W,H),0,0);
  const wrap=document.getElementById('wrap');wrap.innerHTML='';wrap.appendChild(cv);
  const[rg,cls]=regime(t), price=q.price;
  const dir=(prevPrice!=null&&price!=null)?(price>=prevPrice?'up':'dn'):cls;
  prevPrice=price;
  document.getElementById('hud').innerHTML=
    '<b class="'+dir+'">'+(price!=null?'$'+fmtP(price):'—')+'</b> '+B.tk
    +' &nbsp;·&nbsp; <span class="'+cls+'">'+rg+'</span> &nbsp;·&nbsp; THOMQU';
}
</script>
</body>
</html>
